[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "rfx-v2"
version = "2.0.0"
description = "RFP Analyzer V2 — skill-based archetype-routed pipeline"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.30.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.2.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "jinja2>=3.1.4",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.1.0",
    "PyYAML>=6.0.1",
    "pymupdf>=1.24.0",
    "unstructured[pdf]>=0.13.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.2",
    "xlrd>=2.0.1",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "classifier*", "skills_engine*", "spine*", "synthesizer*", "pipeline*", "promotion*", "app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
