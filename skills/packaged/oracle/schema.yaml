version: "1.0"
skill: packaged-oracle
parent: packaged
items:
  - field: id
    type: string
    required: false
  - field: item_type
    type: enum
    values: [module_scope, license_metric, cemli_type, data_migration, integration_point, deployment_model, upgrade_path, other]
    required: true
  - field: title
    type: string
    required: true
  - field: description
    type: string
    required: true
  - field: oracle_products
    type: list[string]
    required: false
    description: e.g. [Oracle Fusion Cloud ERP, HCM Cloud, E-Business Suite R12]
  - field: config_type
    type: enum
    values: [configuration, extension_cemli, modification, not_applicable]
    required: false
  - field: quantified_value
    type: string
    required: false
  - field: mandatory
    type: boolean
    required: true
  - field: raw_excerpt
    type: string
    required: true
  - field: source_section
    type: string
    required: true
  - field: source_type
    type: enum
    values: [text, diagram]
    required: true
    default: text
  - field: source_document
    type: string
    required: false
    description: Original filename this item was extracted from
  - field: document_role
    type: enum
    values: [primary, annexure, qna]
    required: false
    default: primary
  - field: clarified_by
    type: string
    required: false
    description: QnA question text when this item's value was determined or corrected by a QnA answer; null otherwise
