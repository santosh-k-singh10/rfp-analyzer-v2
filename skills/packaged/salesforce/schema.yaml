version: "1.0"
skill: packaged-salesforce
parent: packaged
items:
  - field: id
    type: string
    required: false
  - field: item_type
    type: enum
    values: [product_scope, license_model, config_vs_customize, data_migration, integration_point, appexchange_constraint, org_architecture, other]
    required: true
  - field: title
    type: string
    required: true
  - field: description
    type: string
    required: true
  - field: sf_products
    type: list[string]
    required: false
    description: e.g. [Sales Cloud, Service Cloud, Marketing Cloud]
  - field: config_type
    type: enum
    values: [declarative, apex_lwc_code, flow, mixed, not_applicable]
    required: false
  - field: quantified_value
    type: string
    required: false
  - field: mandatory
    type: boolean
    required: true
  - field: raw_excerpt
    type: string
    required: true
  - field: source_section
    type: string
    required: true
  - field: source_type
    type: enum
    values: [text, diagram]
    required: true
    default: text
  - field: source_document
    type: string
    required: false
    description: Original filename this item was extracted from
  - field: document_role
    type: enum
    values: [primary, annexure, qna]
    required: false
    default: primary
  - field: clarified_by
    type: string
    required: false
    description: QnA question text when this item's value was determined or corrected by a QnA answer; null otherwise
