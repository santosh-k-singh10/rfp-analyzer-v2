version: "1.0"
skill: design-build
items:
  - field: id
    type: string
    required: false
    description: System-assigned ID (e.g. FR-001, NFR-012). Never set by LLM.
  - field: type
    type: enum
    values: [functional, non_functional, staffing_mandate]
    required: true
    description: functional=what the system does, non_functional=quality attribute, staffing_mandate=minimum team role/headcount required by client
  - field: title
    type: string
    required: true
    description: Short label, max 10 words
  - field: description
    type: string
    required: true
    description: Clear, implementation-neutral description of what is required
  - field: source_section
    type: string
    required: true
  - field: priority
    type: enum
    values: [must, should, could, wont]
    required: true
  - field: confidence
    type: float
    required: true
    description: 0.0–1.0 — how clearly stated in the RFP
  - field: ambiguity_flag
    type: boolean
    required: true
  - field: min_headcount
    type: integer
    required: false
    description: Minimum number of resources required for this role (staffing_mandate items only)
  - field: primary_responsibility
    type: string
    required: false
    description: The role's primary responsibility as stated in the RFP (staffing_mandate items only)
  - field: clarification_question
    type: string
    required: false
  - field: raw_excerpt
    type: string
    required: true
    description: Verbatim source text
  - field: source_type
    type: enum
    values: [text, diagram]
    required: true
    default: text
  - field: source_document
    type: string
    required: false
    description: Original filename this item was extracted from
  - field: document_role
    type: enum
    values: [primary, annexure, qna]
    required: false
    default: primary
  - field: clarified_by
    type: string
    required: false
    description: QnA question text when this item's value was determined or corrected by a QnA answer; null otherwise
